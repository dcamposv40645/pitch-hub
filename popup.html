<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pitch Hub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo-icon">♪</span>
      <h1>Pitch Hub</h1>
    </header>

    <div class="key-display">
      <div class="key-label">Detected Key</div>
      <div class="key-root" id="keyRoot">--</div>
      <div class="key-quality" id="keyQuality"></div>
      <div class="confidence" id="confidence"></div>
      <div class="chord-label">Chords</div>
      <div class="scale-notes" id="scaleNotes"></div>
    </div>

    <button class="btn" id="startBtn">Start Detection</button>

    <div class="engine-row">
      <span class="engine-label">Engine</span>
      <button class="btn-beta" id="betaBtn">Try Essentia Beta</button>
    </div>

    <div class="section-divider"></div>

    <div class="identify-row">
      <button class="btn-identify" id="identifyBtn">Identify Song</button>
      <button class="btn-settings" id="settingsBtn" title="API credentials">&#9881;</button>
    </div>

    <div class="identify-result" id="identifyResult"></div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-group-title">ACRCloud</div>
      <label class="settings-label">Host</label>
      <input class="settings-input" id="acrHost" type="text" placeholder="identify-eu-west-1.acrcloud.com">
      <label class="settings-label">Access Key</label>
      <input class="settings-input" id="acrKey" type="text" placeholder="your access key">
      <label class="settings-label">Access Secret</label>
      <input class="settings-input" id="acrSecret" type="password" placeholder="your access secret">

      <div class="settings-group-title" style="margin-top:10px">Spotify</div>
      <label class="settings-label">Client ID</label>
      <input class="settings-input" id="spotifyId" type="text" placeholder="your client id">
      <label class="settings-label">Client Secret</label>
      <input class="settings-input" id="spotifySecret" type="password" placeholder="your client secret">

      <button class="btn-save" id="saveCredBtn">Save</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
